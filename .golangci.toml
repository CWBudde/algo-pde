version = "2"

[linters]
default = 'all'
disable = [
    'depguard',
    'err113',
    'exhaustruct',
    # v2.12 renamed the implementation; keep the intentional numerical-library
    # policy above stable across golangci-lint upgrades.
    'exhaustruct_v5',
    'godoclint',
    'gomoddirectives',
    # gomodguard is deprecated (v2.12.0); replaced by gomodguard_v2, enabled below.
    'gomodguard',
    'gosec',
    'ireturn',
    'musttag',
    'nlreturn',
    'noctx',
    'nonamedreturns',
    'noinlineerr',
    'paralleltest',
    'recvcheck',
    'wrapcheck',
    'wsl',
    'wsl_v5',
    # Style/metric linters that fight a numerical library: dense math kernels
    # have high branch/complexity counts and short domain names (nx, hx, eig,
    # dx) by design, and sentinel-error/test-fixture globals are idiomatic.
    # Correctness linters below stay on.
    'cyclop',
    'funlen',
    'gochecknoglobals',
    'gocognit',
    'lll',
    'nestif',
    'varnamelen',
    # modernize would rewrite hot backward index loops (e.g. the per-element
    # odometer in periodic_nd.go) into slices.Backward range-over-func
    # iterators, adding call overhead in the solver's inner loops. Its useful
    # range-over-int check is already covered by intrange.
    'modernize',
]
enable = [
    "revive",
    "gomodguard_v2",
]

[linters.settings.revive]
[[linters.settings.revive.rules]]
name = "var-naming"
disabled = true

[[linters.settings.revive.rules]]
name = "file-length-limit"

[[linters.settings.revive.rules.arguments]]
max = 1500
skip-comments = false
skip-blank-lines = false

# A bare default: case fully handles the remaining BCType values (returning an
# error), so treat it as exhaustive rather than demanding every enum arm.
[linters.settings.exhaustive]
default-signifies-exhaustive = true

[linters.exclusions]
generated = 'lax'
presets = ['comments', 'common-false-positives', 'legacy', 'std-error-handling']
paths = ['third_party$', 'builtin$', '(^|/)examples/']

[[linters.exclusions.rules]]
linters = ['mnd']
path = '.*\.go'

[[linters.exclusions.rules]]
linters = ['testpackage']
path = '.*_test\.go'

[[linters.exclusions.rules]]
linters = ['dupl']
path = '.*_test\.go'

# Test helpers legitimately take uniform-valued params (e.g. a fixed tolerance
# constant), which unparam flags as always-same; not a concern in test scaffolding.
[[linters.exclusions.rules]]
linters = ['unparam']
path = '.*_test\.go'

# Test assertions routinely bind `max := maxAbsDiff(...)`; shadowing the min/max
# builtins is harmless there and never reaches production. predeclared stays on
# for non-test code, where a real shadow would matter.
[[linters.exclusions.rules]]
linters = ['predeclared']
path = '.*_test\.go'

[severity]
default = 'warn'

[[severity.rules]]
linters = ['exhaustive', 'exhaustruct', 'godox']
severity = 'info'

[formatters]
enable = ['gofumpt', 'goimports']

[formatters.exclusions]
generated = 'lax'
paths = ['third_party$', 'builtin$', '(^|/)examples/']
