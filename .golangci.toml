version = "2"

[linters]
default = 'all'
disable = [
    'depguard',
    'err113',
    'exhaustruct',
    'godoclint',
    'gomoddirectives',
    'gosec',
    'ireturn',
    'musttag',
    'nlreturn',
    'noctx',
    'nonamedreturns',
    'noinlineerr',
    'paralleltest',
    'recvcheck',
    'wrapcheck',
    'wsl',
    'wsl_v5',
]
enable = [
    "revive",
]

[linters.settings.revive]
[[linters.settings.revive.rules]]
name = "var-naming"
disabled = true

[[linters.settings.revive.rules]]
name = "file-length-limit"

[[linters.settings.revive.rules.arguments]]
max = 1500
skip-comments = false
skip-blank-lines = false
[linters.settings.varnamelen]
# Common math/grid variable names
ignore-names = ['a', 'b', 'x', 'y', 'z', 'i', 'j', 'k', 'n', 'm', 'h', 'ok', 'bc', 'nx', 'ny', 'nz', 'hx', 'hy', 'hz', 'tt', 'h2', 'pi', 'it', 'w', 'k1', 'k2']
ignore-decls = ['T any']

[linters.exclusions]
generated = 'lax'
presets = ['comments', 'common-false-positives', 'legacy', 'std-error-handling']
paths = ['third_party$', 'builtin$', 'examples$']

[[linters.exclusions.rules]]
linters = ['mnd']
path = '.*\.go'

[[linters.exclusions.rules]]
linters = ['testpackage']
path = '.*_test\.go'

[[linters.exclusions.rules]]
linters = ['dupl']
path = '.*_test\.go'

[severity]
default = 'warn'

[[severity.rules]]
linters = ['exhaustive', 'exhaustruct', 'godox']
severity = 'info'

[formatters]
enable = ['gofumpt', 'goimports']

[formatters.exclusions]
generated = 'lax'
paths = ['third_party$', 'builtin$', 'examples$']
