<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acoustic Room Modes - algo-pde</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', monospace;
    }

    #canvas {
      display: block;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: crosshair;
      object-fit: contain;
    }

    /* WebGL volume render: smooth (not pixelated), grab cursor for orbiting. */
    #glCanvas {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      cursor: grab;
      touch-action: none;
    }

    #glCanvas:active {
      cursor: grabbing;
    }

    #overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #fff;
      font-size: 13px;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
      user-select: none;
      pointer-events: none;
      line-height: 1.6;
      z-index: 10;
    }

    #overlay .status {
      opacity: 0.95;
      font-weight: bold;
    }

    #overlay .fps {
      color: #0f0;
      font-weight: bold;
    }

    #overlay .debug {
      color: #ff0;
      margin-top: 4px;
      font-size: 12px;
    }

    #overlay .hint {
      margin-top: 8px;
      opacity: 0.75;
      font-size: 11px;
      color: #aaa;
    }

    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
      z-index: 10;
    }

    #controls.active {
      display: flex;
    }

    .button-row {
      display: flex;
      gap: 8px;
    }

    #controls button {
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 8px 16px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }

    #controls button:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.6);
    }

    #controls button:active {
      transform: scale(0.95);
    }

    .mode-btn.active {
      background: rgba(255, 255, 255, 0.85);
      color: #000;
      border-color: #fff;
    }

    .mode-btn.active:hover {
      background: rgba(255, 255, 255, 0.95);
    }

    #controls button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #controls button:disabled:hover {
      background: rgba(0, 0, 0, 0.8);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .depth-control,
    .density-control {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .depth-control.active,
    .density-control.active {
      display: flex;
    }

    #depthSlider,
    #densitySlider {
      width: 400px;
      max-width: 80vw;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.3);
      outline: none;
      border-radius: 2px;
      cursor: pointer;
    }

    #depthSlider::-webkit-slider-thumb,
    #densitySlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
    }

    #depthSlider::-moz-range-thumb,
    #densitySlider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
    }

    #freqSlider {
      width: 400px;
      max-width: 80vw;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.3);
      outline: none;
      border-radius: 2px;
      cursor: pointer;
    }

    #freqSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
    }

    #freqSlider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
    }

    .time-display {
      color: #fff;
      font-size: 11px;
      opacity: 0.9;
    }

    #info {
      position: absolute;
      bottom: 12px;
      right: 12px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 10px;
      text-align: right;
      user-select: none;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <canvas id="glCanvas"></canvas>

  <div id="overlay">
    <div class="status">Loading WASM module...</div>
    <div class="debug"></div>
    <div class="hint"></div>
  </div>

  <div id="controls">
    <div class="button-row">
      <button id="mode2dBtn" class="mode-btn active" type="button">2D room</button>
      <button id="mode3dSliceBtn" class="mode-btn" type="button">3D slices</button>
      <button id="mode3dVolBtn" class="mode-btn" type="button">3D volume</button>
    </div>
    <div class="time-display">
      Drive frequency: <span id="freqDisplay">120 Hz</span>
    </div>
    <input type="range" id="freqSlider" min="40" max="600" value="120" step="1">
    <div id="depthControl" class="depth-control">
      <div class="time-display">
        Z-slice (depth): <span id="depthDisplay">0.0 m</span>
      </div>
      <input type="range" id="depthSlider" min="0" max="47" value="24" step="1">
    </div>
    <div id="densityControl" class="density-control">
      <div class="time-display">
        Volume density: <span id="densityDisplay">1.0×</span>
      </div>
      <input type="range" id="densitySlider" min="0.2" max="3" value="1" step="0.1">
    </div>
  </div>

  <div id="info">
    algo-pde: Acoustic Room Modes<br>
    Driven Helmholtz (complex shift) + FFT solver
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
